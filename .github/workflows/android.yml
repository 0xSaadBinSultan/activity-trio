name: Android builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build and test on Linux/macOS
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ActivityTrio-debug-${{ runner.os }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Android-reports-${{ runner.os }}
          path: app/build/reports/
